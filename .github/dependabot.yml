version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # actionsのバージョン更新は個別にPRを作らずまとめる
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # devDependenciesしか持たないためまとめて更新する
      npm:
        patterns:
          - '*'
