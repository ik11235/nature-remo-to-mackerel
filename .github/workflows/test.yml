name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json の engines で宣言している下限(メンテナンスLTS)から、現行リリースまでを確認する
        node-version:
          - '22'
          - '24'
          - '26'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # テスト自体は依存パッケージを使わないが、package-lock.jsonが
      # インストール可能な状態かをあわせて確認する
      - run: npm ci
      - run: npm test
